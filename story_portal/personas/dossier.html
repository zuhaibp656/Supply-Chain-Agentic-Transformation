<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Story &amp; Journey | Supply Chain Agentic Transformation</title>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/aurora.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  (function() { if ((localStorage.getItem('deck-theme') || 'light') === 'dark') document.documentElement.classList.add('theme-dark'); })();
  function toggleTheme() {
    var d = document.documentElement.classList.toggle('theme-dark');
    localStorage.setItem('deck-theme', d ? 'dark' : 'light');
    paintBtns(!d);
  }
  function paintBtns(isLight) {
    document.querySelectorAll('.theme-toggle-btn').forEach(function(b) {
      b.innerHTML = isLight ? '<span style="font-size:13px">🌙</span><span>Dark Mode</span>' : '<span style="font-size:13px">☀️</span><span>Light Mode</span>';
    });
  }
  document.addEventListener('DOMContentLoaded', function() { paintBtns(!document.documentElement.classList.contains('theme-dark')); });
</script>
<style>
  body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font-body); }
  .persona-wrap { max-width: 1260px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px) 84px; }
  .bc { padding-top: 22px; display: flex; align-items: center; gap: 8px; font: 600 12px var(--font-mono); color: var(--text-dim); flex-wrap: wrap; }
  .bc a { color: var(--blue-ink); text-decoration: none; }

  .persona-switch-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 11px 16px; margin: 14px 0 20px; box-shadow: var(--shadow-sm); }
  .persona-switch-bar select { font: 600 13.5px var(--font-display); padding: 8px 12px; border-radius: 8px; background: var(--surface-sunk); color: var(--text); border: 1px solid var(--border-subtle); min-width: 280px; }
  .nav-persona-btn { font: 700 11.5px var(--font-mono); padding: 8px 13px; border-radius: 8px; background: var(--surface-sunk); color: var(--text-muted); border: 1px solid var(--border-subtle); text-decoration: none; }
  .nav-persona-btn:hover { border-color: var(--p-accent, var(--g-blue)); color: var(--blue-ink); }

  /* Open Aurora Identity Card with Vibrant Pillar Accent */
  .persona-id-card {
    display: grid; grid-template-columns: auto minmax(0,1fr); column-gap: 28px; align-items: start;
    background: linear-gradient(135deg, color-mix(in srgb, var(--p-accent, #3186FF) 6%, var(--surface)) 0%, var(--surface) 60%);
    border: 1px solid color-mix(in srgb, var(--p-accent, #3186FF) 28%, var(--border-subtle));
    border-left: 5px solid var(--p-accent, #3186FF);
    border-radius: 18px; padding: 26px 30px; margin-bottom: 24px; box-shadow: var(--shadow-md);
  }
  @media (max-width: 720px) { .persona-id-card { grid-template-columns: 1fr; row-gap: 14px; } }
  .p-portrait { width: 92px; height: 92px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font: 700 32px var(--font-display); color: #FFF;
                background: linear-gradient(135deg, var(--p-accent, #3186FF), #4B31E3);
                box-shadow: 0 8px 20px color-mix(in srgb, var(--p-accent, #3186FF) 32%, transparent); }
  .p-fig { margin-top: 12px; font: 700 17px var(--font-mono); color: var(--green-ink); }
  .p-fig small { display: block; font: 500 11.5px var(--font-body); color: var(--text-dim); margin-top: 2px; }

  /* Highlighted Clickable AI Agent Answer Banner (Placed AFTER Daily Journey) */
  .agent-answer-card {
    position: relative; padding: 2.5px; border-radius: 20px; background: var(--gemini-spark);
    box-shadow: 0 14px 34px rgba(49,134,255,.18); margin-top: 28px; transition: transform .18s, box-shadow .18s;
  }
  .agent-answer-card:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(49,134,255,.26); }
  .agent-answer-in {
    display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    background: linear-gradient(135deg, color-mix(in srgb, var(--p-accent, #3186FF) 6%, var(--surface)) 0%, var(--surface) 100%);
    border-radius: 18px; padding: 22px 28px; text-decoration: none; color: inherit;
  }
  .aa-kicker { font: 800 11px var(--font-mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--p-ink, var(--blue-ink)); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .aa-title { font: 700 clamp(21px, 2.3vw, 27px)/1.2 var(--font-display); color: var(--text); margin: 0 0 5px; }
  .aa-sub { font-size: 14.5px; color: var(--text-muted); margin: 0; max-width: 66ch; line-height: 1.45; }
  .aa-cta {
    flex-shrink: 0; font: 700 14px var(--font-display); padding: 13px 24px; border-radius: 999px;
    background: var(--gemini-spark); color: #FFF; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 20px rgba(49,134,255,.28);
  }

  /* Persona Daily Journey Timeline */
  .j-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .j-head h2 { font: 700 20px var(--font-display); margin: 0; border-left: 4px solid var(--p-accent, var(--g-blue)); padding-left: 12px; }
  .j-head span { font-size: 13px; color: var(--text-muted); }

  .j-list { display: flex; flex-direction: column; gap: 12px; }
  .j-item {
    background: var(--surface); border: 1px solid var(--border-subtle); border-left: 4px solid color-mix(in srgb, var(--p-accent, #3186FF) 45%, transparent);
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
  }
  .j-item.open { border-color: var(--p-accent, var(--g-blue)); box-shadow: var(--shadow-md); }
  .j-btn {
    width: 100%; border: 0; background: transparent; cursor: pointer; padding: 15px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; text-align: left; color: inherit;
  }
  .j-time { font: 700 12px var(--font-mono); padding: 4px 10px; border-radius: 8px; background: color-mix(in srgb, var(--p-accent, #3186FF) 12%, var(--surface-sunk)); color: var(--p-ink, var(--blue-ink)); border: 1px solid color-mix(in srgb, var(--p-accent, #3186FF) 28%, transparent); }
  .j-task { font: 600 15.5px var(--font-display); color: var(--text); }
  .j-delta { font: 700 11.5px var(--font-mono); padding: 3px 10px; border-radius: 999px; background: rgba(0,175,87,.14); color: var(--green-ink); }
  .j-agent-pill { font: 600 11.5px var(--font-display); padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--p-accent, #3186FF) 14%, transparent); color: var(--p-ink, var(--blue-ink)); text-decoration: none; border: 1px solid color-mix(in srgb, var(--p-accent, #3186FF) 30%, transparent); }
  .j-agent-pill:hover { background: var(--p-accent, var(--g-blue)); color: #FFF; }

  .j-body { display: none; padding: 0 20px 18px; border-top: 1px dashed var(--border-subtle); }
  .j-item.open .j-body { display: block; }
  .j-split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 14px; }
  @media (max-width: 820px) { .j-split { grid-template-columns: 1fr; } }
  .j-box { padding: 14px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; color: var(--text-muted); }
  .j-box.bad { background: rgba(252,65,61,.05); border: 1px solid rgba(252,65,61,.22); border-top: 3px solid var(--g-red); }
  .j-box.good { background: rgba(0,175,87,.06); border: 1px solid rgba(0,175,87,.24); border-top: 3px solid var(--g-green); }
  .j-box b { display: block; font: 700 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
</style>
</head>
<body>

<header class="executive-top-nav" style="backdrop-filter: blur(20px); background: color-mix(in srgb, var(--surface) 88%, transparent); border-bottom: 1px solid var(--border-subtle); padding: 14px max(24px, 4vw); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;">
  <a href="../index.html" style="display:flex;align-items:center;gap:14px;text-decoration:none;">
    <img src="../assets/media/wip/image25.png" alt="Google Cloud" style="height:30px;width:auto;">
    <div style="width:1px;height:20px;background:var(--border-subtle);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text);letter-spacing:1.4px;text-transform:uppercase;">PERSONA STORY // DAILY JOURNEY</span>
  </a>
  <nav style="display:flex;align-items:center;gap:14px;">
    <button class="theme-toggle-btn" onclick="toggleTheme()" type="button"></button>
    <a id="navPillarBack" href="../pages/pillar.html" style="font:700 13px var(--font-display);color:var(--blue-ink);text-decoration:none;padding:5px 12px;border-radius:8px;background:rgba(49,134,255,.10);">&larr; Back to Sub-Pillars</a>
    <span style="font:700 13px var(--font-mono);color:var(--g-blue);" id="personaCounter">01 / 60</span>
    <a href="index.html" style="font:700 12.5px var(--font-display);color:#000;background:#FFF;padding:6px 14px;border-radius:20px;text-decoration:none;border:1px solid var(--border-subtle);">Chessboard &#8599;</a>
  </nav>
</header>

<main style="padding-top:64px;">
  <div class="persona-wrap" id="personaRoot"></div>
</main>

<script src="../data/sc_story_data.js"></script>
<script src="../data/sc_value_model.js"></script>
<script>
(function () {
  var list = window.SC_DATA.personas;
  var agents = window.SC_DATA.agents;
  var agentById = Object.fromEntries(agents.map(function (a) { return [a.id, a]; }));
  var valMap = window.SC_VALUES.computeForPersonas(list).byPersonaId;
  var pid = new URLSearchParams(location.search).get('id');
  var idx = Math.max(0, list.findIndex(function (x) { return x.id === pid; }));
  var p = list[idx];
  var ag = agentById[p.primaryAgentId] || {};
  var pv = valMap[p.id] || { tier: 'next', paybackDays: 90, total: 5.0, prod: 0.5, flow: 1.5, shield: 1.5, recov: 1.5, why: '' };
  var tierLabel = pv.tier === 'first' ? 'Priority 1 · Build First (<90d)' : (pv.tier === 'next' ? 'Priority 2 · Build Next' : 'Priority 3 · Enabler');

  document.title = p.name + ' | Persona Journey';
  document.getElementById('personaCounter').textContent = p.code + ' / ' + list.length;
  document.getElementById('navPillarBack').href = '../pages/pillar.html?dept=' + p.deptId + '&sub=' + encodeURIComponent(p.subPillarId || '');

  var prevP = list[(idx - 1 + list.length) % list.length];
  var nextP = list[(idx + 1) % list.length];
  var initials = p.name.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  var slots = Array.isArray(p.dayInLife) ? p.dayInLife : [];

  function shortTxt(t, max) {
    t = String(t || '').trim();
    return t.length > max ? t.slice(0, max - 1).trim() + '…' : t;
  }

  var root = document.getElementById('personaRoot');
  root.style.setProperty('--p-accent', p.deptColor);
  root.style.setProperty('--p-ink', p.deptInk);

  var slotsHtml = slots.map(function (s, i) {
    var slotAg = s.agentId ? agentById[s.agentId] : null;
    var isOpen = (i === 0);
    return '<div class="j-item ' + (isOpen ? 'open' : '') + '">' +
      '<button type="button" class="j-btn" data-idx="' + i + '">' +
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
          '<span class="j-time">' + (s.time || 'Daily') + '</span>' +
          '<span class="j-task">' + (s.task || 'Operational Review') + '</span>' +
          (s.isToil ? '<span class="j-delta">' + (s.toilDuration || '') + ' &rarr; ' + (s.afterDuration || '') + '</span>' : '') +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          (slotAg ? '<a class="j-agent-pill" href="../pages/agent.html?id=' + encodeURIComponent(slotAg.id) + '">&#10022; ' + slotAg.name + ' &rarr;</a>' : '') +
          '<span style="font:600 11.5px var(--font-mono);color:var(--text-dim)">&#9662;</span>' +
        '</div>' +
      '</button>' +
      '<div class="j-body">' +
        (s.isToil
          ? '<div class="j-split">' +
              '<div class="j-box bad"><b style="color:var(--red-ink)">Manual Bottleneck Today</b>' + shortTxt(s.before, 195) + '</div>' +
              '<div class="j-box good"><b style="color:var(--green-ink)">With ' + (slotAg ? slotAg.name : p.primaryAgentName) + '</b>' + shortTxt(s.after, 195) + '</div>' +
            '</div>'
          : '<div style="padding-top:12px;font-size:13.5px;color:var(--text-muted)">' + (s.activity || '') + '</div>') +
      '</div>' +
    '</div>';
  }).join('');

  root.innerHTML =
    '<div class="bc"><a href="../index.html">Briefing Map</a> <span>/</span> <a href="../pages/pillar.html?dept=' + p.deptId + '">' + p.deptTitle + '</a> <span>/</span> <a href="../pages/pillar.html?dept=' + p.deptId + '&sub=' + encodeURIComponent(p.subPillarId || '') + '">' + p.subPillarName + '</a> <span>/</span> <span>' + p.name + '</span></div>' +

    '<div class="persona-switch-bar">' +
      '<a class="nav-persona-btn" href="?id=' + encodeURIComponent(prevP.id) + '">&larr; ' + prevP.code + '</a>' +
      '<select id="pSelect" aria-label="Switch persona">' +
        list.map(function (x) { return '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>' + x.code + ' · ' + x.name + ' (' + x.subPillarName + ')</option>'; }).join('') +
      '</select>' +
      '<a class="nav-persona-btn" href="?id=' + encodeURIComponent(nextP.id) + '">' + nextP.code + ' &rarr;</a>' +
      '<span style="margin-left:auto;font:700 11.5px var(--font-mono);color:var(--green-ink)">' + (p.liveInGE ? '&#9679; LIVE IN GEMINI ENTERPRISE' : 'CATALOG ROLE') + '</span>' +
    '</div>' +

    '<section class="persona-id-card">' +
      '<div>' +
        '<div class="p-portrait">' + initials + '</div>' +
        '<div class="p-fig">$' + pv.total.toFixed(1) + 'M/yr<small>' + (p.headlineStat || p.timeSaved) + ' · ' + p.toilHoursBefore + 'h &rarr; ' + p.toilHoursAfter + 'h/wk</small></div>' +
      '</div>' +
      '<div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">' +
          '<span style="font:700 11px var(--font-mono);color:' + p.deptInk + ';text-transform:uppercase">' + p.code + ' &middot; ' + p.deptTitle + ' &middot; ' + p.subPillarName + '</span>' +
          '<span style="font:700 10.5px var(--font-mono);padding:3px 9px;border-radius:999px;background:rgba(49,134,255,.12);color:var(--blue-ink)">' + tierLabel + '</span>' +
        '</div>' +
        '<h1 style="font-family:var(--font-display);font-size:clamp(24px,2.6vw,34px);margin:0 0 8px">' + p.name + '</h1>' +
        '<p style="margin:0 0 12px;font-size:15px;line-height:1.58;color:var(--text-muted)">' + (p.summary || p.mandate) + '</p>' +
        '<div style="display:flex;gap:14px;flex-wrap:wrap;font:600 12px var(--font-mono);color:var(--text-muted);padding-top:10px;border-top:1px dashed var(--border-subtle)">' +
          '<span>Productivity: <b>$' + pv.prod.toFixed(1) + 'M</b></span>' +
          '<span>Flow &amp; Capital: <b>$' + pv.flow.toFixed(1) + 'M</b></span>' +
          '<span>Leakage &amp; Risk: <b>$' + pv.shield.toFixed(1) + 'M</b></span>' +
          '<span>Revenue &amp; Salvage: <b>$' + pv.recov.toFixed(1) + 'M</b></span>' +
        '</div>' +
      '</div>' +
    '</section>' +

    '<div class="j-head">' +
      '<h2>Persona Daily Journey</h2>' +
      '<span>Click any daily step to compare Manual Bottleneck vs. With Gemini AI</span>' +
    '</div>' +
    '<section class="j-list">' + slotsHtml + '</section>' +

    '<div class="agent-answer-card">' +
      '<a class="agent-answer-in" href="../pages/agent.html?id=' + encodeURIComponent(ag.id || p.primaryAgentId) + '">' +
        '<div>' +
          '<div class="aa-kicker">&#10022; Your AI Answer for ' + p.name + (ag.badge ? ' &middot; ' + ag.badge : '') + '</div>' +
          '<div class="aa-title">' + (ag.name || p.primaryAgentName) + '</div>' +
          '<p class="aa-sub">' + (ag.shortDesc || p.mandate) + ' Click to see how it solves this end-to-end, watch demo video, or run live on Gemini Enterprise.</p>' +
        '</div>' +
        '<span class="aa-cta">Explore How ' + (ag.name || 'Agent') + ' Solves This &rarr;</span>' +
      '</a>' +
    '</div>';

  root.querySelectorAll('.j-agent-pill').forEach(function (a) {
    a.addEventListener('click', function (e) { e.stopPropagation(); });
  });
  root.querySelectorAll('.j-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      b.closest('.j-item').classList.toggle('open');
    });
  });
  document.getElementById('pSelect').addEventListener('change', function (e) {
    location.search = '?id=' + encodeURIComponent(e.target.value);
  });
})();
</script>
</body>
</html>
