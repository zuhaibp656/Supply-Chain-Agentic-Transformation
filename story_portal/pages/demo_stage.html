<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · Live Demo Stage | Agentic Supply Chain Transformation</title>
<link rel="icon" href="../assets/media/brand/gemini_spark_fullcolor_768.png" type="image/png">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/aurora.css">
<link rel="stylesheet" href="../assets/story_extra.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=Google+Sans+Text:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
(function(){var s=localStorage.getItem('deck-theme')||'light';if(s==='dark')document.documentElement.classList.add('theme-dark');})();
function toggleTheme(){var d=document.documentElement.classList.toggle('theme-dark');localStorage.setItem('deck-theme',d?'dark':'light');paintTheme(!d);}
function paintTheme(isLight){document.querySelectorAll('.theme-toggle-btn').forEach(function(b){b.innerHTML=isLight?'<span>&#127769;</span><span>Dark Mode</span>':'<span>&#9728;&#65039;</span><span>Light Mode</span>';});}
document.addEventListener('DOMContentLoaded',function(){paintTheme(!document.documentElement.classList.contains('theme-dark'));});
</script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--canvas); color: var(--text); font-family: var(--font-display); }
  @media (min-width: 1024px) and (min-height: 700px) { body { overflow: hidden; } }
  .slide-viewport {
    height: 100vh; box-sizing: border-box; padding: 66px max(28px, 4vw) 74px;
    display: flex; align-items: center; justify-content: center; background: var(--canvas);
  }
  .container { max-width: 1320px; width: 100%; }
  .head-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .headline { font: 800 clamp(24px, 2.5vw, 34px)/1.12 var(--font-display); letter-spacing: -.8px; margin: 0 0 4px; color: var(--text); }
  .sub { margin: 0; font: 400 14px/1.4 var(--font-body); color: var(--text-dim); max-width: 68ch; }
  .demo-select {
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text); font: 600 12.5px var(--font-display); max-width: 310px;
  }
  .stage-grid { display: grid; grid-template-columns: 1.45fr 0.6fr; gap: 18px; align-items: stretch; }
  @media (max-width: 960px) { .slide-viewport { height: auto; min-height: 100vh; } .stage-grid { grid-template-columns: 1fr; } }
  .video-card {
    background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px;
    padding: 12px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 10px;
  }
  .video-frame {
    position: relative; border-radius: 10px; overflow: hidden; background: #0d111a;
    height: clamp(230px, 43vh, 385px); border: 1px solid var(--border-subtle);
  }
  .video-frame video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .upload-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; border-radius: 10px; background: var(--surface-sunk); border: 1px dashed var(--border-strong);
  }
  .up-label {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px;
    background: var(--g-blue); color: #fff; font: 700 12px var(--font-display); cursor: pointer;
  }
  .up-reset {
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong);
    background: var(--surface); color: var(--text-dim); font: 600 11.5px var(--font-display); cursor: pointer;
  }
  .launch-panel {
    background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  }
  .gemini-btn {
    background: var(--gemini-spark); color: #FFF; font: 700 14.5px var(--font-display);
    padding: 12px 18px; border-radius: 999px; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: var(--shadow-md);
  }
  .t-row {
    padding: 8px 11px; border-radius: 9px; background: var(--surface-sunk); border: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
  }
  .t-row span:first-child { color: var(--text-dim); font: 700 10.5px var(--font-mono); text-transform: uppercase; }
  .t-row b { font: 700 12px var(--font-display); color: var(--text); text-align: right; }
</style>
</head>
<body>
<header class="executive-top-nav" style="backdrop-filter:blur(20px);background:color-mix(in srgb,var(--surface) 88%,transparent);border-bottom:1px solid var(--border-subtle);padding:12px max(24px,4vw);position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;">
  <a href="../index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
    <img src="../assets/media/wip/image25.png" alt="Google Cloud" style="height:28px;width:auto;">
    <div style="width:1px;height:18px;background:var(--border-strong);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text);letter-spacing:1.4px;text-transform:uppercase;">STAGE 06 // LIVE DEMO STAGE</span>
  </a>
  <nav style="display:flex;align-items:center;gap:12px;">
    <button class="theme-toggle-btn" onclick="toggleTheme()" type="button"></button>
    <a href="05_plug_is_an_agent.html" style="font:700 12.5px var(--font-display);color:var(--text-dim);text-decoration:none;padding:5px 11px;border-radius:6px;background:var(--surface-sunk);">&larr; Prev Page</a>
    <span style="font:700 12.5px var(--font-mono);color:var(--g-blue);">06 / 15</span>
    <a href="06_one_to_many.html" style="font:700 12.5px var(--font-display);color:var(--blue-ink);text-decoration:none;padding:5px 12px;border-radius:6px;background:rgba(49,134,255,.11);">Next Page &rarr;</a>
    <a href="../index.html" style="font:700 12px var(--font-display);color:#000;background:#FFF;padding:5px 13px;border-radius:20px;text-decoration:none;border:1px solid var(--border-subtle);">All Slides &#8599;</a>
  </nav>
</header>

<main class="slide-viewport">
  <div class="container">
    <div class="head-bar">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
          <span style="width:22px;height:3px;border-radius:2px;background:var(--gemini-spark);"></span>
          <span style="font:800 11.5px var(--font-mono);color:var(--green-ink);letter-spacing:1.2px;text-transform:uppercase;" id="stageKicker">LIVE IN GEMINI ENTERPRISE</span>
        </div>
        <h1 class="headline" id="agentTitle">Demand Sensing Agent</h1>
        <p class="sub" id="agentDesc"></p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select class="demo-select" id="agentQuickSel" aria-label="Choose Live Agent Demo"></select>
      </div>
    </div>

    <div class="stage-grid">
      <div class="video-card">
        <div class="video-frame">
          <video id="demoPlayer" controls playsinline preload="metadata"></video>
        </div>
        <div class="upload-bar">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <label class="up-label">
              <span>&#128228; Upload Demo Video (.mp4 / .webm)</span>
              <input type="file" id="videoUpload" accept="video/*" hidden>
            </label>
            <button type="button" class="up-reset" id="resetVideoBtn" hidden>Revert Built-In Video</button>
          </div>
          <span style="font:600 11.5px var(--font-mono);color:var(--text-dim)" id="videoStatus">Loading bundled recording...</span>
        </div>
      </div>

      <aside class="launch-panel">
        <div>
          <div style="font:700 11px var(--font-mono);color:var(--green-ink);margin-bottom:6px;">&#9679; DIRECT GEMINI ENTERPRISE LINK</div>
          <a class="gemini-btn" id="launchGeBtn" target="_blank" rel="noopener noreferrer" href="#">
            <img src="../assets/media/brand/gemini_spark_fullcolor_768.png" alt="" style="width:18px;height:18px;filter:brightness(0) invert(1);">
            <span>Launch Live Demo &#8599;</span>
          </a>
        </div>
        <div style="display:grid;gap:7px;" id="telemList"></div>
        <div style="background:var(--surface-sunk);border-radius:10px;padding:10px 12px;border:1px solid var(--border-subtle);">
          <div style="font:700 10px var(--font-mono);color:var(--blue-ink);margin-bottom:4px;">TRY THIS PROMPT LIVE</div>
          <div style="font:500 12px/1.38 var(--font-body);color:var(--text);margin-bottom:6px;" id="starterPrompt"></div>
          <button type="button" id="copyPromptBtn" style="font:700 11px var(--font-display);padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;">Copy Prompt</button>
        </div>
      </aside>
    </div>
  </div>
</main>

<aside class="floating-dock" style="display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border:1px solid var(--border-strong);border-radius:30px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(18,19,23,.14);position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1000;">
  <a href="05_plug_is_an_agent.html" style="background:var(--surface-sunk);border:1px solid var(--border-subtle);color:var(--text-muted);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;">&#9664;</a>
  <div style="font:700 12.5px var(--font-mono);color:var(--text-muted);white-space:nowrap;">PAGE 06 // LIVE DEMO STAGE</div>
  <a href="06_one_to_many.html" style="background:var(--g-blue);color:#FFF;padding:6px 15px;border-radius:20px;font:700 13px var(--font-display);text-decoration:none;white-space:nowrap;">07 · "One" Agent to Many &#9654;</a>
</aside>

<script src="../data/sc_story_data.js"></script>
<script src="../data/sc_value_model.js"></script>
<script>
(function(){
  var DATA = window.SC_DATA;
  var qs = new URLSearchParams(location.search);
  var liveAgents = DATA.agents.filter(function(a){ return a.liveInGE; });
  var reqId = qs.get('agent') || 'demand_sensing_agent';
  var ag = DATA.agents.find(function(a){ return a.id === reqId; }) || liveAgents[0];

  var DB_NAME = 'sc_demo_stage_videos_v1';
  function openDb(){
    return new Promise(function(resolve, reject){
      if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){ e.target.result.createObjectStore('videos'); };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e.target.error); };
    });
  }
  function getSavedVideo(k){
    return openDb().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction('videos', 'readonly').objectStore('videos').get(k);
        tx.onsuccess = function(){ resolve(tx.result || null); };
        tx.onerror = function(){ resolve(null); };
      });
    }).catch(function(){ return null; });
  }
  function saveVideo(k, rec){
    return openDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction('videos', 'readwrite');
        tx.objectStore('videos').put(rec, k);
        tx.oncomplete = resolve; tx.onerror = reject;
      });
    });
  }
  function deleteSavedVideo(k){
    return openDb().then(function(db){
      return new Promise(function(resolve){
        var tx = db.transaction('videos', 'readwrite');
        tx.objectStore('videos').delete(k);
        tx.oncomplete = resolve;
      });
    });
  }

  var aSel = document.getElementById('agentQuickSel');
  aSel.innerHTML = liveAgents.map(function(a){
    return '<option value="' + a.id + '"' + (a.id === ag.id ? ' selected' : '') + '>' + a.name + ' (' + a.deptTitle + ')</option>';
  }).join('');
  aSel.addEventListener('change', function(){ location.search = '?agent=' + encodeURIComponent(aSel.value); });

  var valMeta = window.SC_VALUES.BY_AGENT[ag.id] || { tier: 'next', paybackDays: 90, prod: 0.5, flow: 2, shield: 2, recov: 1 };
  var totalVal = (valMeta.prod + valMeta.flow + valMeta.shield + valMeta.recov).toFixed(1);
  var tierLabel = valMeta.tier === 'first' ? 'Priority 1 · Build First' : (valMeta.tier === 'next' ? 'Priority 2 · Build Next' : 'Priority 3 · Enabler');

  document.getElementById('stageKicker').textContent = 'LIVE IN GEMINI ENTERPRISE · ' + ag.deptTitle.toUpperCase();
  document.getElementById('agentTitle').textContent = ag.name;
  document.getElementById('agentDesc').textContent = ag.outcome || ag.shortDesc;
  document.getElementById('launchGeBtn').href = ag.geUrl;
  document.getElementById('starterPrompt').textContent = '"' + ag.samplePrompt + '"';

  document.getElementById('telemList').innerHTML = [
    ['Annual Value', '$' + totalVal + 'M / yr'],
    ['Build Priority', tierLabel + ' (' + valMeta.paybackDays + 'd)'],
    ['Model', ag.model || 'gemini-3.1-pro-preview'],
    ['Human Gate', 'Apigee MCP · 1-Click Approval']
  ].map(function(r){ return '<div class="t-row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('');

  var player = document.getElementById('demoPlayer');
  var statusEl = document.getElementById('videoStatus');
  var resetBtn = document.getElementById('resetVideoBtn');
  var activeBlobUrl = null;
  function loadVideo(){
    if (activeBlobUrl) { URL.revokeObjectURL(activeBlobUrl); activeBlobUrl = null; }
    getSavedVideo(ag.id).then(function(rec){
      if (rec && rec.blob) {
        activeBlobUrl = URL.createObjectURL(rec.blob);
        player.src = activeBlobUrl;
        statusEl.textContent = 'Custom video: ' + rec.name + ' (' + (rec.blob.size/1e6).toFixed(1) + ' MB)';
        resetBtn.hidden = false;
      } else {
        player.src = '../' + (ag.videoSrc || 'assets/media/video/demand_sensing_demo.mp4');
        statusEl.textContent = 'Bundled: ' + (ag.videoSrc || 'demand_sensing_demo.mp4').split('/').pop();
        resetBtn.hidden = true;
      }
    });
  }
  loadVideo();
  document.getElementById('videoUpload').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    saveVideo(ag.id, { name: file.name, type: file.type, blob: file }).then(loadVideo);
  });
  resetBtn.addEventListener('click', function(){ deleteSavedVideo(ag.id).then(loadVideo); });
  document.getElementById('copyPromptBtn').addEventListener('click', function(){
    navigator.clipboard && navigator.clipboard.writeText(ag.samplePrompt);
    this.textContent = 'Copied!';
    var self = this; setTimeout(function(){ self.textContent = 'Copy Prompt'; }, 1400);
  });
})();
</script>
</body>
</html>
