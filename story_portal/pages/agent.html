<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Studio | Supply Chain Agentic Transformation</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/aurora.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function() { if ((localStorage.getItem('deck-theme') || 'light') === 'dark') document.documentElement.classList.add('theme-dark'); })();
    function toggleTheme() {
      var isDark = document.documentElement.classList.toggle('theme-dark');
      localStorage.setItem('deck-theme', isDark ? 'dark' : 'light');
      paintBtns(!isDark);
    }
    function paintBtns(isLight) {
      document.querySelectorAll('.theme-toggle-btn').forEach(function(btn) {
        btn.innerHTML = isLight ? '<span style="font-size:13px">🌙</span><span>Dark Mode</span>' : '<span style="font-size:13px">☀️</span><span>Light Mode</span>';
      });
    }
    document.addEventListener('DOMContentLoaded', function() { paintBtns(!document.documentElement.classList.contains('theme-dark')); });
  </script>
  <style>
    body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font-body); }
    .wrap { max-width: 1460px; margin: 0 auto; padding: 78px max(24px, 4vw) 88px; }
    .bc { display: flex; align-items: center; gap: 8px; font: 600 11.5px var(--font-mono); color: var(--text-dim); margin-bottom: 12px; flex-wrap: wrap; }
    .bc a { color: var(--blue-ink); text-decoration: none; }

    .sib-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .sib-pill { font: 600 12px var(--font-display); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--surface); color: var(--text-muted); text-decoration: none; }
    .sib-pill:hover { border-color: var(--ac, var(--g-blue)); color: var(--text); }
    .sib-pill.on { background: var(--ac, var(--g-blue)); border-color: var(--ac, var(--g-blue)); color: #FFF; }

    /* Ultra-clean Concise Hero + Dual Buttons */
    .ag-hero {
      background: linear-gradient(135deg, color-mix(in srgb, var(--ac, #3186FF) 6%, var(--surface)) 0%, var(--surface) 65%);
      border: 1px solid color-mix(in srgb, var(--ac, #3186FF) 28%, var(--border-subtle));
      border-top: 4px solid var(--ac, var(--g-blue));
      border-radius: 18px; padding: 20px 26px; box-shadow: var(--shadow-md); margin-bottom: 18px;
      display: flex; justify-content: space-between; align-items: center; gap: 22px; flex-wrap: wrap;
    }
    .ag-hero h1 { font: 700 clamp(24px, 2.7vw, 34px)/1.12 var(--font-display); margin: 8px 0 6px; letter-spacing: -0.6px; }
    .ag-desc { font-size: 14.5px; color: var(--text-muted); margin: 0; max-width: 68ch; line-height: 1.45; }

    .ag-cta-box { display: flex; flex-direction: column; gap: 7px; align-items: flex-end; flex-shrink: 0; }
    @media (max-width: 900px) { .ag-cta-box { align-items: flex-start; width: 100%; } }
    .ag-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn-vid {
      background: #00AF57; color: #FFF; font: 700 13.5px var(--font-display); padding: 11px 19px;
      border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
      box-shadow: var(--shadow-sm); transition: transform .15s, filter .15s;
    }
    .btn-vid:hover { transform: translateY(-1px); filter: brightness(1.06); }
    .btn-ge-run {
      background: var(--gemini-spark); color: #FFF; font: 700 13.5px var(--font-display); padding: 11px 22px;
      border-radius: 999px; text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
      box-shadow: var(--shadow-md); transition: transform .15s, box-shadow .15s;
    }
    .btn-ge-run:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }

    /* Runtime Architecture Toggle Card (4-Stage Architecture + Visual Flow Diagram) */
    .v2-card {
      background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 20px;
      padding: 20px 24px; box-shadow: var(--shadow-md); margin-bottom: 18px;
    }
    .v2-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .v2-head h2 { margin: 0; font: 700 19px var(--font-display); }
    .arch-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cadence-pill {
      font: 600 11.5px var(--font-mono); padding: 6px 12px; border-radius: 999px;
      background: var(--surface-sunk); border: 1px solid var(--border-subtle); color: var(--text-muted);
    }
    .arch-toggle {
      display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-sunk);
      border: 1px solid var(--border-subtle); gap: 3px;
    }
    .arch-tab {
      border: 0; background: transparent; color: var(--text-muted); font: 700 12px var(--font-display);
      padding: 7px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, color .15s;
    }
    .arch-tab.active { background: #00AF57; color: #FFF; box-shadow: var(--shadow-xs); }

    .trig-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      padding: 11px 16px; border-radius: 12px; background: color-mix(in srgb, var(--ac, #3186FF) 6%, var(--surface-sunk));
      border: 1px solid color-mix(in srgb, var(--ac, #3186FF) 24%, var(--border-subtle)); margin-bottom: 14px;
    }
    .trig-tag {
      font: 700 10.5px var(--font-mono); letter-spacing: .06em; padding: 4px 10px; border-radius: 999px;
      background: rgba(49,134,255,.12); color: var(--blue-ink); text-transform: uppercase; flex-shrink: 0;
    }
    .trig-txt { font-size: 13px; color: var(--text); flex: 1; min-width: 240px; }
    .trig-platform {
      font: 600 11px var(--font-mono); color: var(--text-muted); padding: 4px 10px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border-subtle);
    }

    /* 4-Stage Pipeline Grid */
    .stage4-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: stretch; }
    @media (max-width: 1080px) { .stage4-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .stage4-grid { grid-template-columns: 1fr; } }
    .st-card {
      background: var(--surface); border: 1px solid var(--border-subtle); border-top: 3px solid var(--stc, #3186FF);
      border-radius: 14px; padding: 14px 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-xs);
    }
    .st-eyebrow { font: 700 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--sti, var(--blue-ink)); }
    .st-title { font: 700 15px var(--font-display); color: var(--text); margin: 0; }
    .st-list { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--text-muted); line-height: 1.42; }
    .st-list li strong { color: var(--text); }
    .st-step {
      padding: 9px 10px; border-radius: 10px; background: var(--surface-sunk); border: 1px solid var(--border-subtle);
      display: flex; gap: 9px; align-items: flex-start;
    }
    .st-num {
      font: 700 10.5px var(--font-mono); background: var(--g-blue); color: #FFF; padding: 2px 6px;
      border-radius: 6px; flex-shrink: 0; margin-top: 2px;
    }
    .st-step-n { font: 700 12.5px var(--font-display); color: var(--text); margin-bottom: 2px; }
    .st-step-r { font-size: 12px; color: var(--text-muted); line-height: 1.38; }

    .sys-group-lbl { font: 700 10px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin-bottom: 5px; }
    .sys-chip {
      font: 600 12px var(--font-display); padding: 7px 10px; border-radius: 9px; margin-bottom: 5px;
      background: var(--surface-sunk); border: 1px solid var(--border-subtle); color: var(--text);
    }
    .sys-chip.write { background: rgba(0,175,87,.08); border-color: rgba(0,175,87,.28); color: var(--green-ink); }
    .hitl-box {
      margin-top: auto; padding: 10px 12px; border-radius: 10px; background: rgba(245,158,11,.10);
      border: 1px solid rgba(245,158,11,.35); font-size: 12px; line-height: 1.4; color: var(--text);
    }
    .hitl-box b { display: block; font: 700 10.5px var(--font-mono); color: #9A5B00; text-transform: uppercase; margin-bottom: 3px; }
    html.theme-dark .hitl-box b { color: #FBBF24; }
    .armor-note {
      margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--border-subtle);
      font-size: 11.5px; color: var(--text-dim); line-height: 1.38;
    }
    .cortex-bar {
      margin-top: 14px; padding: 10px 14px; border-radius: 11px; background: var(--surface-sunk);
      border: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--text-muted);
    }
    .cortex-bar a { color: var(--blue-ink); font-weight: 700; text-decoration: none; }

    .v2-svg-box { border-radius: 16px; overflow: hidden; border: 1px solid rgba(49,134,255,.32); background: #070C18; margin-bottom: 16px; }
    .arch-pane { display: none; }
    .arch-pane.on { display: block; }

    /* 3 Collaborating Sub-Agents Grid (shown inside Visual Flow Diagram tab) */
    .sub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 900px) { .sub-grid { grid-template-columns: 1fr; } }
    .sub-box {
      padding: 14px 16px; border-radius: 14px; background: var(--surface-sunk);
      border: 1px solid var(--border-subtle); border-left: 3px solid var(--sc, var(--g-blue));
    }
    .sub-k { font: 700 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--si, var(--blue-ink)); margin-bottom: 4px; }
    .sub-n { font: 700 14.5px var(--font-display); color: var(--text); margin-bottom: 4px; }
    .sub-r { font-size: 12.5px; color: var(--text-muted); line-height: 1.42; }

    /* Compact Prompt + Persona Link */
    .bot-strip {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--border-subtle); border-left: 4px solid var(--g-purple);
      border-radius: 16px; padding: 14px 20px; box-shadow: var(--shadow-sm);
    }

    /* Amandeep Video Modal */
    .ms-modal { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; background: rgba(10,12,16,.84); backdrop-filter: blur(6px); }
    .ms-modal.open { display: flex; }
    .ms-modal-in { width: min(92vw, 1200px); display: flex; flex-direction: column; gap: 10px; }
    .ms-modal video { width: 100%; max-height: 78vh; border-radius: 12px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
    .ms-modal-bar { display: flex; justify-content: space-between; align-items: center; color: #FFF; font-family: var(--font-display); }
    .ms-modal .x { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; font-size: 18px; background: #FFF; color: #121317; }
  </style>
</head>
<body>

  <header class="executive-top-nav" style="backdrop-filter: blur(20px); background: color-mix(in srgb, var(--surface) 88%, transparent); border-bottom: 1px solid var(--border-subtle); padding: 14px max(24px, 4vw); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;">
    <a href="../index.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none;">
      <img src="../assets/media/wip/image25.png" alt="Google Cloud" style="height: 30px; width: auto;">
      <div style="width: 1px; height: 20px; background: var(--border-subtle);"></div>
      <span id="navAgLabel" style="font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 1.4px; text-transform: uppercase;">AGENT STUDIO</span>
    </a>
    <nav style="display: flex; align-items: center; gap: 14px;">
      <button class="theme-toggle-btn" onclick="toggleTheme()" type="button"></button>
      <a id="navPersonaLink" href="../personas/dossier.html" style="font: 700 13px var(--font-display); color: var(--blue-ink); text-decoration: none; padding: 5px 12px; border-radius: 8px; background: rgba(49,134,255,.10);">&larr; Persona Journey</a>
      <a href="../index.html" style="font: 700 12.5px var(--font-display); color: #000; background: #FFF; padding: 6px 14px; border-radius: 20px; text-decoration: none; border: 1px solid var(--border-subtle);">Briefing Map &#8599;</a>
    </nav>
  </header>

  <main class="wrap" id="agWrap"></main>

  <div class="ms-modal" id="msModal" role="dialog" aria-label="Agent Demo Video">
    <div class="ms-modal-in">
      <div class="ms-modal-bar">
        <span id="vidModalTitle" style="font-weight:700;font-size:16px">Agent Demo Video</span>
        <div style="display:flex;gap:10px;align-items:center">
          <label style="font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);cursor:pointer">
            Replace MP4 <input type="file" accept="video/*" id="customVidInput" style="display:none">
          </label>
          <button class="x" type="button" id="vidCloseBtn" aria-label="Close video">&#10005;</button>
        </div>
      </div>
      <video id="msVideo" controls playsinline preload="metadata"></video>
    </div>
  </div>

<script src="../data/sc_story_data.js"></script>
<script>
(function () {
  var DATA = window.SC_DATA;
  var aid = new URLSearchParams(location.search).get('id') || 'demand_sensing_agent';
  var ag = DATA.agents.find(function (a) { return a.id === aid; }) || DATA.agents[0];
  var dept = DATA.departments.find(function (d) { return d.id === ag.deptId; }) || DATA.departments[0];
  var sibs = DATA.agents.filter(function (a) { return a.deptId === ag.deptId; });

  document.title = ag.name + ' | Agent Studio';
  document.getElementById('navAgLabel').textContent = dept.title + ' // ' + ag.name;
  document.getElementById('navPersonaLink').href = '../personas/dossier.html?id=' + encodeURIComponent(ag.primaryPersonaId || '');

  function cleanLabel(s, m) {
    s = String(s || '').replace(/\(.*\)/g, '').trim();
    return s.length > m ? s.slice(0, m - 1).trim() + '…' : s;
  }

  var sysArr = (ag.systems || 'SAP S/4HANA · BigQuery Cortex · Partner Feeds').split('·').map(function (s) { return cleanLabel(s, 23); });
  var solverName = cleanLabel((ag.solverStack || 'OR-Tools CP-SAT / MILP').split('+')[0], 22);
  var writeTarget = cleanLabel((ag.apiWriteback || 'SAP ERP / WMS Approval').split(',')[0], 22);
  var col = ag.deptColor || dept.color || '#3186FF';
  var ink = ag.deptInk || dept.ink || '#286DD1';

  var subs = ag.subAgents && ag.subAgents.length >= 3 ? ag.subAgents : [
    { name: 'Signal & Context Ingest', role: 'Normalizes live ERP, EDI, and telemetry feeds into BigQuery.' },
    { name: 'Deterministic Solver Engine', role: 'Evaluates multi-variable constraints with zero hallucination.' },
    { name: 'A2UI & MCP Gatekeeper', role: 'Renders VegaCharts, HTML cockpits, and signed ERP proposals.' }
  ];

  /* Exact V2 5-Stage Multi-Agent A2A System Topology Diagram (from build_site.py lines 8933-9013) */
  var v2Diagram =
    '<svg viewBox="0 0 1120 264" style="width:100%;height:auto;display:block">' +
      '<defs>' +
        '<linearGradient id="archFlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">' +
          '<stop offset="0%" stop-color="' + col + '"/><stop offset="50%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#10b981"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<line x1="210" y1="132" x2="240" y2="132" stroke="url(#archFlowGrad)" stroke-width="3" stroke-dasharray="6 4"/>' +
      '<line x1="430" y1="132" x2="460" y2="132" stroke="url(#archFlowGrad)" stroke-width="3" stroke-dasharray="6 4"/>' +
      '<line x1="660" y1="132" x2="690" y2="132" stroke="url(#archFlowGrad)" stroke-width="3" stroke-dasharray="6 4"/>' +
      '<line x1="880" y1="132" x2="910" y2="132" stroke="url(#archFlowGrad)" stroke-width="3" stroke-dasharray="6 4"/>' +
      '<circle cy="132" r="4.5" fill="' + col + '"><animate attributeName="cx" from="210" to="240" dur="1.1s" repeatCount="indefinite"/></circle>' +
      '<circle cy="132" r="4.5" fill="#00d2ff"><animate attributeName="cx" from="430" to="460" dur="1.1s" repeatCount="indefinite"/></circle>' +
      '<circle cy="132" r="4.5" fill="#c084fc"><animate attributeName="cx" from="660" to="690" dur="1.1s" repeatCount="indefinite"/></circle>' +
      '<circle cy="132" r="4.5" fill="#10b981"><animate attributeName="cx" from="880" to="910" dur="1.1s" repeatCount="indefinite"/></circle>' +

      '<rect x="16" y="30" width="194" height="204" rx="14" fill="#0F172A" stroke="' + col + '" stroke-width="2"/>' +
      '<text x="30" y="58" fill="' + col + '" font-family="Roboto Mono" font-size="11" font-weight="700">01 · INGEST &amp; SENSING</text>' +
      '<text x="30" y="84" fill="#FFFFFF" font-family="Google Sans" font-size="15" font-weight="700">Enterprise Feeds</text>' +
      '<text x="30" y="114" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; ' + (sysArr[0] || 'SAP S/4HANA & IBP') + '</text>' +
      '<text x="30" y="138" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; ' + (sysArr[1] || 'WMS / TMS Streams') + '</text>' +
      '<text x="30" y="162" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; ' + (sysArr[2] || 'Partner EDI &amp; Weather') + '</text>' +
      '<text x="30" y="204" fill="#38BDF8" font-family="Roboto Mono" font-size="11" font-weight="700">Pub/Sub + Apigee</text>' +

      '<rect x="240" y="30" width="190" height="204" rx="14" fill="#0F172A" stroke="#00D2FF" stroke-width="2"/>' +
      '<text x="254" y="58" fill="#00D2FF" font-family="Roboto Mono" font-size="11" font-weight="700">02 · DIGITAL TWIN</text>' +
      '<text x="254" y="84" fill="#FFFFFF" font-family="Google Sans" font-size="15" font-weight="700">Cortex v7 &amp; Spanner</text>' +
      '<text x="254" y="114" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; BigQuery Twin &amp; GIS</text>' +
      '<text x="254" y="138" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; Spanner Graph BOM</text>' +
      '<text x="254" y="162" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; AlloyDB pgvector</text>' +
      '<text x="254" y="204" fill="#00D2FF" font-family="Roboto Mono" font-size="11" font-weight="700">BQ · Spanner · AlloyDB</text>' +

      '<rect x="460" y="20" width="200" height="224" rx="16" fill="#141E37" stroke="#A855F7" stroke-width="2.4"/>' +
      '<text x="474" y="50" fill="#C084FC" font-family="Roboto Mono" font-size="11" font-weight="700">03 · ADK ORCHESTRATOR</text>' +
      '<text x="474" y="76" fill="#FFFFFF" font-family="Google Sans" font-size="15" font-weight="700">' + cleanLabel(ag.name, 22) + '</text>' +
      '<text x="474" y="106" fill="#F1F5F9" font-family="Google Sans Text" font-size="12">&bull; Gemini 3.1 Pro / 3.8 Flash</text>' +
      '<text x="474" y="130" fill="#F1F5F9" font-family="Google Sans Text" font-size="12">&bull; 3 A2A Specialist Agents</text>' +
      '<text x="474" y="154" fill="#F1F5F9" font-family="Google Sans Text" font-size="12">&bull; TimesFM &amp; WeatherNext</text>' +
      '<text x="474" y="178" fill="#F1F5F9" font-family="Google Sans Text" font-size="12">&bull; Document AI &amp; Maps</text>' +
      '<text x="474" y="214" fill="#C084FC" font-family="Roboto Mono" font-size="11" font-weight="700">Vertex Agent Engine</text>' +

      '<rect x="690" y="30" width="190" height="204" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>' +
      '<text x="704" y="58" fill="#FBBF24" font-family="Roboto Mono" font-size="11" font-weight="700">04 · MATH SOLVER</text>' +
      '<text x="704" y="84" fill="#FFFFFF" font-family="Google Sans" font-size="15" font-weight="700">' + solverName + '</text>' +
      '<text x="704" y="114" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; OR-Tools CP-SAT/MILP</text>' +
      '<text x="704" y="138" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; Margin &amp; Risk Bounds</text>' +
      '<text x="704" y="162" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; Maps &amp; Rate Cards</text>' +
      '<text x="704" y="204" fill="#FBBF24" font-family="Roboto Mono" font-size="11" font-weight="700">100% Deterministic</text>' +

      '<rect x="910" y="30" width="194" height="204" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>' +
      '<text x="924" y="58" fill="#34D399" font-family="Roboto Mono" font-size="11" font-weight="700">05 · ACTION &amp; A2UI</text>' +
      '<text x="924" y="84" fill="#FFFFFF" font-family="Google Sans" font-size="15" font-weight="700">VegaChart + Write-Back</text>' +
      '<text x="924" y="114" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; 2-Panel VegaChart Card</text>' +
      '<text x="924" y="138" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; HTML5 What-If Cockpit</text>' +
      '<text x="924" y="162" fill="#E2E8F0" font-family="Google Sans Text" font-size="12">&bull; ' + writeTarget + '</text>' +
      '<text x="924" y="204" fill="#34D399" font-family="Roboto Mono" font-size="11" font-weight="700">' + cleanLabel(ag.badge || 'ROI Verified', 22) + '</text>' +
    '</svg>';

  document.getElementById('agWrap').innerHTML =

    '<div class="sib-bar">' + sibs.map(function (s) {
      return '<a class="sib-pill ' + (s.id === ag.id ? 'on' : '') + '" style="--ac:' + col + '" href="?id=' + encodeURIComponent(s.id) + '">' + s.name + '</a>';
    }).join('') + '</div>' +

    '<section class="ag-hero" style="--ac:' + col + '">' +
      '<div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
          '<span style="font:700 11px var(--font-mono);color:' + ink + ';text-transform:uppercase">' + dept.num + ' · ' + dept.title + ' · ' + ag.subPillarName + '</span>' +
          (ag.badge ? '<span style="font:700 11px var(--font-mono);padding:3px 9px;border-radius:999px;background:rgba(49,134,255,.12);color:var(--blue-ink)">' + ag.badge + '</span>' : '') +
          (ag.liveInGE ? '<span style="font:700 10.5px var(--font-mono);padding:3px 9px;border-radius:999px;background:rgba(0,175,87,.14);color:var(--green-ink)">&#9679; LIVE ON ARGOLIS GE</span>' : '') +
        '</div>' +
        '<h1>' + ag.name + '</h1>' +
        '<p class="ag-desc">' + (ag.shortDesc || '') + ' &mdash; <b style="color:var(--text)">' + (ag.outcome || ag.badge || '') + '</b></p>' +
      '</div>' +
      '<div class="ag-cta-box">' +
        '<div class="ag-btns">' +
          '<button type="button" id="vidLaunchBtn" class="btn-vid">&#9654; Watch Demo Video</button>' +
          '<a href="' + ag.geUrl + '" target="_blank" rel="noopener noreferrer" class="btn-ge-run">' + (ag.liveInGE ? 'Run on Gemini Enterprise &#8599;' : 'Open Argolis GE Workspace &#8599;') + '</a>' +
        '</div>' +
        '<span style="font:500 11px var(--font-mono);color:var(--text-dim)">' + (ag.liveInGE ? 'GE Agent ID: ' + ag.geShortId + ' · cid/47d2d150...d34a' : 'Catalog Spec · Opens Argolis GE App') + '</span>' +
      '</div>' +
    '</section>' +

    '<section class="v2-card">' +
      '<div class="v2-head">' +
        '<div>' +
          '<div style="font:700 11px var(--font-mono);text-transform:uppercase;color:' + ink + ';margin-bottom:2px">&#10022; ' + (ag.archetypeLabel || 'Agentic Execution') + ' &middot; Vertex AI Agent Engine</div>' +
          '<h2>How This Agent Works &mdash; End-to-End Runtime Architecture</h2>' +
        '</div>' +
        '<div class="arch-controls">' +
          '<span class="cadence-pill">' + (ag.cadence || 'Event + Micro-Batch') + '</span>' +
          '<div class="arch-toggle" role="tablist">' +
            '<button type="button" class="arch-tab active" data-arch-view="4stage">&#128203; 4-Stage Architecture</button>' +
            '<button type="button" class="arch-tab" data-arch-view="diagram">&#128256; Visual Flow Diagram</button>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div id="archPane4Stage" class="arch-pane on">' +
        '<div class="trig-strip" style="--ac:' + col + '">' +
          '<span class="trig-tag">&#9679; Triggered When</span>' +
          '<div class="trig-txt">' + (ag.trigger || 'Fires automatically on telemetry drift, ERP threshold breach, or business user query.') + '</div>' +
          '<span class="trig-platform">' + (ag.solverStack ? cleanLabel(ag.solverStack, 38) : 'Gemini Enterprise · ADK · BigQuery') + '</span>' +
        '</div>' +

        '<div class="stage4-grid">' +
          '<div class="st-card" style="--stc:#3186FF;--sti:#286DD1">' +
            '<div class="st-eyebrow">1. What It Takes</div>' +
            '<h3 class="st-title">Inputs &amp; Guardrails</h3>' +
            '<div style="font:600 12px var(--font-display);padding:6px 10px;border-radius:8px;background:var(--surface-sunk);border:1px solid var(--border-subtle);color:var(--text)">&#128100; ' + (ag.primaryPersonaName || 'Operations Lead') + '</div>' +
            '<ul class="st-list">' +
              (ag.readSystems || sysArr).slice(0, 3).map(function (rs) {
                return '<li><strong>' + cleanLabel(rs, 42) + '</strong> live enterprise feed</li>';
              }).join('') +
              '<li><strong>Policy &amp; SLA tolerances</strong> from Master Data Backbone</li>' +
            '</ul>' +
            '<div class="armor-note">&#128274; <b>Model Armor:</b> Masks PII, vendor rate cards, and contract pricing prior to LLM reasoning.</div>' +
          '</div>' +

          '<div class="st-card" style="--stc:#4B31E3;--sti:#4B31E3">' +
            '<div class="st-eyebrow">2. What It Does (Step-by-Step)</div>' +
            '<h3 class="st-title">' + cleanLabel(ag.name, 26) + '</h3>' +
            subs.slice(0, 3).map(function (sub, i) {
              return '<div class="st-step">' +
                '<span class="st-num">0' + (i + 1) + '</span>' +
                '<div><div class="st-step-n">' + sub.name + '</div><div class="st-step-r">' + sub.role + '</div></div>' +
              '</div>';
            }).join('') +
          '</div>' +

          '<div class="st-card" style="--stc:#0A7684;--sti:#0A7684">' +
            '<div class="st-eyebrow">3. Systems Connected</div>' +
            '<h3 class="st-title">Reads vs. Updates</h3>' +
            '<div>' +
              '<div class="sys-group-lbl">Reads From (Read-Only)</div>' +
              '<div class="sys-chip">&#128268; Google Cloud Cortex v7 (BigQuery)</div>' +
              (ag.readSystems || sysArr).slice(0, 2).map(function (rs) {
                return '<div class="sys-chip">&#9889; ' + cleanLabel(rs, 36) + '</div>';
              }).join('') +
            '</div>' +
            '<div>' +
              '<div class="sys-group-lbl">Updates / Notifies (Gated)</div>' +
              '<div class="sys-chip write">&#9989; ' + cleanLabel(ag.apiWriteback || 'ERP / WMS Staged Action', 36) + '</div>' +
              '<div class="sys-chip write">&#128202; Adaptive UI (Text / VegaChart / Smart HTML)</div>' +
            '</div>' +
          '</div>' +

          '<div class="st-card" style="--stc:#00AF57;--sti:#007F3F">' +
            '<div class="st-eyebrow">4. What It Produces</div>' +
            '<h3 class="st-title">Outputs &amp; Sign-Off</h3>' +
            '<ul class="st-list">' +
              (ag.outputs || ['Ranked corrective schedule', 'Adaptive visual charts / cockpit on demand']).map(function (o) {
                return '<li>' + o + '</li>';
              }).join('') +
              '<li><strong>Measured Outcome:</strong> ' + (ag.badge || ag.outcome || 'Verified ROI') + '</li>' +
            '</ul>' +
            '<div class="hitl-box"><b>&#9995; Human-in-the-Loop Sign-Off</b>' + (ag.hitlGate || 'Auto-stages policy-compliant options; requires 1-click lead approval before ERP commit.') + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="cortex-bar">' +
          '<span>&#129521; <b>Cortex Engine:</b> Harmonizes ERP &amp; WMS Change Data Capture (CDC) via <b>Google Cloud Cortex Framework (v7)</b> BigQuery Data Products.</span>' +
          '<span><a href="https://cloud.google.com/solutions/cortex" target="_blank" rel="noopener noreferrer">Cortex Official Docs &#8599;</a> &nbsp;&middot;&nbsp; <a href="09_agent_architecture.html">Enterprise Topology &#8594;</a></span>' +
        '</div>' +
      '</div>' +

      '<div id="archPaneDiagram" class="arch-pane">' +
        '<div class="v2-svg-box">' + v2Diagram + '</div>' +
        '<div class="sub-grid">' +
          subs.slice(0, 3).map(function (sub, i) {
            var subCols = ['#3186FF', '#4B31E3', '#00AF57'];
            var subInks = ['#286DD1', '#4B31E3', '#007F3F'];
            return '<div class="sub-box" style="--sc:' + subCols[i % 3] + ';--si:' + subInks[i % 3] + '">' +
              '<div class="sub-k">Sub-Agent 0' + (i + 1) + ' &middot; A2A Protocol</div>' +
              '<div class="sub-n">' + sub.name + '</div>' +
              '<div class="sub-r">' + sub.role + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</section>' +

    '<section class="bot-strip">' +
      '<div>' +
        '<div style="font:700 10.5px var(--font-mono);color:var(--purple-ink);text-transform:uppercase;margin-bottom:2px">Realistic Question to Ask in Gemini Enterprise</div>' +
        '<div style="font-size:14px;color:var(--text)">&ldquo;' + ag.samplePrompt + '&rdquo;</div>' +
      '</div>' +
      '<a href="../personas/dossier.html?id=' + encodeURIComponent(ag.primaryPersonaId || '') + '" style="font:700 13px var(--font-display);color:var(--blue-ink);text-decoration:none">&larr; Back to ' + (ag.primaryPersonaName || 'Persona') + '</a>' +
    '</section>';

  document.querySelectorAll('.arch-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.getAttribute('data-arch-view');
      document.querySelectorAll('.arch-tab').forEach(function (b) { b.classList.toggle('active', b === btn); });
      document.getElementById('archPane4Stage').classList.toggle('on', view === '4stage');
      document.getElementById('archPaneDiagram').classList.toggle('on', view === 'diagram');
    });
  });

  var modal = document.getElementById('msModal');
  var vid = document.getElementById('msVideo');
  document.getElementById('vidModalTitle').textContent = ag.name + ' — Demo Video';
  vid.src = '../' + ag.videoSrc;

  document.getElementById('vidLaunchBtn').addEventListener('click', function () {
    modal.classList.add('open');
    vid.play().catch(function () {});
  });
  function closeVid() { vid.pause(); modal.classList.remove('open'); }
  document.getElementById('vidCloseBtn').addEventListener('click', closeVid);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeVid(); });
  document.getElementById('customVidInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) { vid.src = URL.createObjectURL(f); vid.play().catch(function () {}); }
  });
})();
</script>
</body>
</html>
