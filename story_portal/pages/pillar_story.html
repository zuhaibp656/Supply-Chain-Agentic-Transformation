<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pillar Story | Agentic Supply Chain Transformation</title>
<link rel="icon" href="../assets/media/brand/gemini_spark_fullcolor_768.png" type="image/png">
<link rel="stylesheet" href="../assets/aurora.css">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/story_extra.css">
<script>
try {
  var t = localStorage.getItem('deck-theme');
  document.documentElement.className = (t === 'dark') ? 'theme-dark' : 'theme-light';
} catch (e) {}
</script>
<style>
  :root {
    --font-display: 'Google Sans', 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-sans: 'Google Sans Text', 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body { margin: 0; font-family: var(--font-sans); background: var(--s-bg); color: var(--s-ink); min-height: 100vh; }
  .mast {
    position: sticky; top: 0; z-index: 40; min-height: 56px;
    background: color-mix(in srgb, var(--s-card) 90%, transparent);
    backdrop-filter: blur(16px); border-bottom: 1px solid var(--s-line);
    display: flex; align-items: center; padding: 8px max(18px, 3vw); gap: 12px; flex-wrap: wrap;
  }
  .mast-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--s-ink); font: 700 13.5px var(--font-display); }
  .pillar-sel {
    padding: 5px 10px; border-radius: 999px; border: 1px solid var(--s-line);
    background: var(--s-glass2); color: var(--s-ink); font: 600 12px var(--font-display); cursor: pointer;
  }
  .mast-spacer { flex: 1; }
  .mast-nav { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .mast-btn {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--s-line);
    background: var(--s-glass2); color: var(--s-ink); font: 600 12px var(--font-sans);
    text-decoration: none; cursor: pointer;
  }
  .mast-btn:hover { border-color: var(--blue-ink); color: var(--blue-ink); }
  .mast-count { font: 700 12px var(--font-mono); color: var(--s-ink3); padding: 0 4px; }
  .mast-cta { padding: 6px 14px; border-radius: 999px; background: var(--g-blue); color: #fff; font: 700 12px var(--font-display); text-decoration: none; }

  .beat-rail {
    max-width: 1220px; margin: 16px auto 0; padding: 0 max(18px, 3vw);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .beat-tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--s-line); background: var(--s-card); color: var(--s-ink2);
    font: 600 12px var(--font-display); text-decoration: none; cursor: pointer;
  }
  .beat-tab.active {
    background: color-mix(in srgb, var(--pc, var(--g-blue)) 13%, var(--s-card));
    border-color: var(--pc, var(--g-blue)); color: var(--s-ink); font-weight: 700;
  }

  .wrap { max-width: 1220px; margin: 18px auto 96px; padding: 0 max(18px, 3vw); display: grid; gap: 20px; }

  /* Beat 1: Capital Reality */
  .b1-hero {
    display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: stretch;
  }
  @media (max-width: 900px) { .b1-hero { grid-template-columns: 1fr; } }
  .story-card {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 22px;
    padding: clamp(22px, 3vw, 34px); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between;
  }
  .eyebrow { font: 700 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--pc, var(--blue-ink)); margin-bottom: 10px; }
  .b-h1 { font: 700 clamp(26px, 3.1vw, 40px)/1.1 var(--font-display); letter-spacing: -.025em; margin: 0 0 14px; }
  .b-lead { font-size: 15.5px; line-height: 1.62; color: var(--s-ink2); margin: 0 0 20px; }
  .photo-frame {
    position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--s-line);
    box-shadow: var(--shadow-md); min-height: 290px; background: var(--s-card);
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cap {
    position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 10px 14px;
    border-radius: 12px; background: rgba(18, 19, 23, .76); color: #fff;
    font: 600 12px var(--font-display); backdrop-filter: blur(8px);
  }
  .metrics-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 920px) { .metrics-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .metrics-4 { grid-template-columns: 1fr; } }
  .m-card {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 16px;
    padding: 18px 18px; border-top: 3px solid var(--tc, var(--g-blue)); box-shadow: var(--shadow-sm);
  }
  .m-val { font: 700 clamp(24px, 2.2vw, 32px)/1.1 var(--font-display); color: var(--ti, var(--s-ink)); margin-bottom: 6px; }
  .m-lbl { font: 700 13px var(--font-display); color: var(--s-ink); margin-bottom: 6px; }
  .m-sub { font-size: 12.5px; line-height: 1.48; color: var(--s-ink2); }

  /* Beat 2: Swiss Cheese */
  .cheese-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 920px) { .cheese-grid { grid-template-columns: 1fr; } }
  .toggle-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .st-btn {
    padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--s-line);
    background: var(--s-glass2); color: var(--s-ink); font: 700 12.5px var(--font-display); cursor: pointer;
  }
  .st-btn.active.bad { border-color: var(--g-red); background: rgba(252,65,61,.12); color: var(--red-ink); }
  .st-btn.active.good { border-color: var(--g-green); background: rgba(0,175,87,.12); color: var(--green-ink); }
  .barrier-list { display: grid; gap: 10px; }
  .barrier-row {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 14px;
    padding: 13px 16px; border-left: 4px solid var(--g-red);
  }
  .barrier-row.is-good { border-left-color: var(--g-green); }
  .br-k { font: 700 11.5px var(--font-mono); color: var(--s-ink3); margin-bottom: 4px; text-transform: uppercase; }
  .br-v { font-size: 13.5px; line-height: 1.5; color: var(--s-ink); }
  .cheese-visual {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 20px;
    padding: 16px; box-shadow: var(--shadow-sm);
  }
  .cheese-visual img { width: 100%; border-radius: 14px; display: block; border: 1px solid var(--s-line); }

  /* Beat 3: Gap Chart */
  .chart-panel {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 20px;
    padding: 22px 24px; box-shadow: var(--shadow-sm);
  }
  .kpi-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 780px) { .kpi-3 { grid-template-columns: 1fr; } }
  .k-card {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 16px;
    padding: 18px 20px; box-shadow: var(--shadow-sm);
  }
  .k-val { font: 700 28px var(--font-display); color: var(--blue-ink); margin-bottom: 4px; }
  .k-lbl { font: 700 13.5px var(--font-display); margin-bottom: 4px; }
  .k-sub { font-size: 12.5px; line-height: 1.5; color: var(--s-ink2); }

  /* Beat 4: 5 Criteria + Coexistence */
  .crit-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 1020px) { .crit-5 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .crit-5 { grid-template-columns: 1fr; } }
  .crit-card {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 16px;
    padding: 16px; border-top: 3px solid var(--pc, var(--g-blue)); box-shadow: var(--shadow-sm);
  }
  .crit-tag { font: 700 10.5px var(--font-mono); color: var(--blue-ink); letter-spacing: .08em; margin-bottom: 6px; }
  .crit-title { font: 700 14.5px var(--font-display); margin-bottom: 6px; }
  .crit-desc { font-size: 12.5px; line-height: 1.5; color: var(--s-ink2); }
  .coex-banner {
    background: var(--s-card); border: 1px solid var(--s-line); border-radius: 20px;
    padding: 20px 24px; display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 14px; align-items: center;
  }
  @media (max-width: 820px) { .coex-banner { grid-template-columns: 1fr; text-align: center; } }
  .coex-box-item { padding: 14px 16px; border-radius: 14px; background: var(--s-glass2); border: 1px solid var(--s-line); font: 700 13.5px var(--font-display); text-align: center; }
  .coex-op { font: 700 22px var(--font-display); color: var(--blue-ink); text-align: center; }

  .dock {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 900;
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: color-mix(in srgb, var(--s-card) 94%, transparent);
    border: 1px solid var(--s-line); border-radius: 999px;
    backdrop-filter: blur(12px); box-shadow: 0 10px 28px rgba(18,19,23,.14);
  }
  .dock a { text-decoration: none; font: 700 13px var(--font-display); }
  .dock-btn { padding: 6px 14px; border-radius: 999px; background: var(--g-blue); color: #fff; }
</style>
</head>
<body>
<header class="mast">
  <a class="mast-brand" href="../index.html">
    <img src="../assets/media/brand/gemini_spark_fullcolor_768.png" alt="Gemini" style="height:22px;width:22px;">
    <span>Briefing Map</span>
  </a>
  <select id="pillarSel" class="pillar-sel" aria-label="Select Supply Chain Pillar"></select>
  <span class="mast-spacer"></span>
  <nav class="mast-nav">
    <button class="mast-btn" id="themeToggle" type="button">Dark</button>
    <a class="mast-btn" id="hdrPrev" href="00_executive_story.html">&larr; Prev</a>
    <span class="mast-count" id="hdrCount">01 / 15</span>
    <a class="mast-btn" id="hdrNext" href="#">Next &rarr;</a>
    <a class="mast-cta" id="hdrSub" href="pillar.html">Sub-Pillars &#8599;</a>
  </nav>
</header>

<nav class="beat-rail" id="beatRail"></nav>
<main class="wrap" id="beatHost"></main>

<aside class="dock">
  <a id="dockPrev" href="#" style="color:var(--s-ink2)">&larr; Prev</a>
  <span style="font:700 12px var(--font-mono);color:var(--s-ink3)" id="dockLabel">BEAT 01 // CAPITAL REALITY</span>
  <a class="dock-btn" id="dockNext" href="#">Next &rarr;</a>
</aside>

<script src="../data/sc_story_data.js"></script>
<script>
(function () {
  var btn = document.getElementById('themeToggle');
  function paintTheme() { btn.textContent = document.documentElement.classList.contains('theme-dark') ? 'Light' : 'Dark'; }
  paintTheme();

  var DATA = window.SC_DATA;
  var qs = new URLSearchParams(location.search);
  var pillarId = qs.get('pillar') || qs.get('dept') || DATA.departments[0].id;
  var dept = DATA.departments.find(function (d) { return d.id === pillarId; }) || DATA.departments[0];
  var beat = Math.min(4, Math.max(1, parseInt(qs.get('beat') || '1', 10) || 1));

  document.documentElement.style.setProperty('--pc', dept.color);
  document.title = '0' + beat + ' · ' + dept.title + ' | Agentic Supply Chain';

  var sel = document.getElementById('pillarSel');
  sel.innerHTML = DATA.departments.map(function (d) {
    return '<option value="' + d.id + '"' + (d.id === dept.id ? ' selected' : '') + '>' + d.num + ' · ' + d.title + '</option>';
  }).join('');
  sel.addEventListener('change', function () {
    location.search = '?pillar=' + encodeURIComponent(sel.value) + '&beat=' + beat;
  });

  var BEAT_NAMES = [
    { b: 1, num: '01', name: 'Capital & Margin Reality' },
    { b: 2, num: '02', name: 'Swiss Cheese Barriers' },
    { b: 3, num: '03', name: 'Talent & Complexity Gap' },
    { b: 4, num: '04', name: 'AI Plug & Coexistence' }
  ];

  document.getElementById('beatRail').innerHTML = BEAT_NAMES.map(function (x) {
    return '<a class="beat-tab' + (x.b === beat ? ' active' : '') + '" href="?pillar=' + dept.id + '&beat=' + x.b + '">' +
      '<span>' + x.num + '</span><span>' + x.name + '</span></a>';
  }).join('') + '<a class="beat-tab" href="demo_stage.html?pillar=' + dept.id + '"><span>05</span><span>&#9654; Live Demo Stage</span></a>';

  var prevUrl = beat > 1 ? ('pillar_story.html?pillar=' + dept.id + '&beat=' + (beat - 1)) : ('00_executive_story.html?pillar=' + dept.id);
  var nextUrl = beat < 4 ? ('pillar_story.html?pillar=' + dept.id + '&beat=' + (beat + 1)) : ('demo_stage.html?pillar=' + dept.id);
  var nextLbl = beat < 4 ? (BEAT_NAMES[beat].num + ' · ' + BEAT_NAMES[beat].name) : '05 · Launch Live Demo';

  document.getElementById('hdrPrev').href = prevUrl;
  document.getElementById('hdrNext').href = nextUrl;
  document.getElementById('hdrCount').textContent = '0' + beat + ' / 15';
  document.getElementById('hdrSub').href = 'pillar.html?dept=' + dept.id;
  document.getElementById('dockPrev').href = prevUrl;
  document.getElementById('dockNext').href = nextUrl;
  document.getElementById('dockNext').innerHTML = nextLbl + ' &rarr;';
  document.getElementById('dockLabel').textContent = dept.num + ' · BEAT 0' + beat + ' // ' + BEAT_NAMES[beat - 1].name.toUpperCase();

  var TONE = {
    blue: ['#3186FF', 'var(--blue-ink)'],
    red: ['#FC413D', 'var(--red-ink)'],
    green: ['#00AF57', 'var(--green-ink)'],
    amber: ['#D97706', '#9A5B00']
  };

  var host = document.getElementById('beatHost');
  var st = dept.story;

  function renderBeat() {
    if (beat === 1) {
      var b1 = st.beat1;
      host.innerHTML =
        '<section class="b1-hero">' +
          '<div class="story-card">' +
            '<div>' +
              '<div class="eyebrow">' + b1.eyebrow + '</div>' +
              '<h1 class="b-h1">' + b1.title + '</h1>' +
              '<p class="b-lead">' + b1.lead + '</p>' +
            '</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
              '<a class="sc-cite-link" target="_blank" rel="noopener noreferrer" href="' + dept.proofUrl + '">' + dept.proofLabel + ' &#8599;</a>' +
              '<a class="mast-btn" href="pillar.html?dept=' + dept.id + '">Browse ' + dept.subPillars.length + ' Sub-Pillars &rarr;</a>' +
            '</div>' +
          '</div>' +
          '<div class="photo-frame">' +
            '<img src="../assets/media/photos/' + dept.photo + '" alt="' + dept.title + '">' +
            '<div class="photo-cap">' + b1.photoCap + '</div>' +
          '</div>' +
        '</section>' +
        '<section class="metrics-4">' +
          b1.metrics.map(function (m) {
            var c = TONE[m.tone] || TONE.blue;
            return '<div class="m-card" style="--tc:' + c[0] + ';--ti:' + c[1] + '">' +
              '<div class="m-val">' + m.value + '</div>' +
              '<div class="m-lbl">' + m.label + '</div>' +
              '<div class="m-sub">' + m.sub + '</div>' +
            '</div>';
          }).join('') +
        '</section>';
      return;
    }

    if (beat === 2) {
      var b2 = st.beat2;
      var mode = 'baseline';
      function drawCheese() {
        var dark = document.documentElement.classList.contains('theme-dark');
        var imgFile = (mode === 'baseline')
          ? (dark ? 'swiss_cheese_clean_baseline.jpg' : 'swiss_cheese_clean_baseline_light.jpg')
          : (dark ? 'swiss_cheese_clean_fortified.jpg' : 'swiss_cheese_clean_fortified_light.jpg');

        host.innerHTML =
          '<section class="story-card">' +
            '<div class="eyebrow">' + b2.eyebrow + '</div>' +
            '<h1 class="b-h1">' + b2.title + '</h1>' +
            '<p class="b-lead">' + b2.lead + '</p>' +
            '<div class="toggle-row">' +
              '<button type="button" class="st-btn bad' + (mode === 'baseline' ? ' active' : '') + '" id="btnBase">' + b2.baselineTag + '</button>' +
              '<button type="button" class="st-btn good' + (mode === 'fortified' ? ' active' : '') + '" id="btnFort">' + b2.fortifiedTag + '</button>' +
            '</div>' +
            '<p style="margin:0;font:600 14px/1.55 var(--font-sans);color:' + (mode === 'baseline' ? 'var(--red-ink)' : 'var(--green-ink)') + '">' +
              (mode === 'baseline' ? b2.baselineSummary : b2.fortifiedSummary) +
            '</p>' +
          '</section>' +
          '<section class="cheese-grid">' +
            '<div class="cheese-visual">' +
              '<img src="../assets/media/photos/' + imgFile + '" alt="Swiss Cheese Barrier Model">' +
              '<div style="margin-top:10px;font:600 12px var(--font-mono);color:var(--s-ink3)">' +
                (mode === 'baseline' ? 'BASELINE: Disconnected spreadsheets align every failure hole into an incident.' : 'FORTIFIED: Autonomous agents inspect & plug every slice before value leaks.') +
              '</div>' +
            '</div>' +
            '<div class="barrier-list">' +
              b2.barriers.map(function (br) {
                var good = mode === 'fortified';
                return '<div class="barrier-row' + (good ? ' is-good' : '') + '">' +
                  '<div class="br-k">' + br.layer + (good ? ' · PLUGGED BY AGENT' : ' · ALIGNED VULNERABILITY') + '</div>' +
                  '<div class="br-v">' + (good ? br.plug : br.gap) + '</div>' +
                '</div>';
              }).join('') +
            '</div>' +
          '</section>';

        document.getElementById('btnBase').addEventListener('click', function () { mode = 'baseline'; drawCheese(); });
        document.getElementById('btnFort').addEventListener('click', function () { mode = 'fortified'; drawCheese(); });
      }
      drawCheese();
      btn.addEventListener('click', function () { setTimeout(drawCheese, 10); });
      return;
    }

    if (beat === 3) {
      var b3 = st.beat3;
      var W = 820, H = 290, px = 52, py = 26, pw = W - 82, ph = H - 64;
      function sx(i) { return px + (i / (b3.years.length - 1)) * pw; }
      function sy(v) { return py + ((105 - v) / 85) * ph; }
      var capPts = b3.capacity.map(function (v, i) { return sx(i).toFixed(1) + ',' + sy(v).toFixed(1); }).join(' ');
      var cpxPts = b3.complexity.map(function (v, i) { return sx(i).toFixed(1) + ',' + sy(v).toFixed(1); }).join(' ');
      var polyArea = b3.complexity.map(function (v, i) { return sx(i).toFixed(1) + ',' + sy(v).toFixed(1); }).concat(
        b3.capacity.slice().reverse().map(function (v, j) { var i = b3.capacity.length - 1 - j; return sx(i).toFixed(1) + ',' + sy(v).toFixed(1); })
      ).join(' ');

      var gridHtml = [20, 40, 60, 80, 100].map(function (g) {
        var y = sy(g).toFixed(1);
        return '<line x1="' + px + '" y1="' + y + '" x2="' + (W - 30) + '" y2="' + y + '" stroke="var(--s-line)" stroke-dasharray="4 4"/>' +
          '<text x="' + (px - 10) + '" y="' + (parseFloat(y) + 4) + '" text-anchor="end" fill="var(--s-ink3)" font-size="11" font-family="var(--font-mono)">' + g + '</text>';
      }).join('');
      var xLabels = b3.years.map(function (yr, i) {
        return '<text x="' + sx(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" fill="var(--s-ink2)" font-size="11.5" font-family="var(--font-mono)">' + yr + '</text>';
      }).join('');

      host.innerHTML =
        '<section class="story-card">' +
          '<div class="eyebrow">' + b3.eyebrow + '</div>' +
          '<h1 class="b-h1">' + b3.title + '</h1>' +
          '<p class="b-lead" style="margin-bottom:0">' + b3.lead + '</p>' +
        '</section>' +
        '<section class="chart-panel">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:12px">' +
            '<div><div style="font:700 16px var(--font-display)">' + b3.chartTitle + '</div><div style="font-size:12.5px;color:var(--s-ink3)">' + b3.chartSub + '</div></div>' +
            '<div style="display:flex;gap:16px;font:700 12px var(--font-mono)">' +
              '<span style="color:var(--g-blue)">&#9679; Operational Complexity</span>' +
              '<span style="color:var(--g-red)">&#9679; Manual Team Capacity</span>' +
            '</div>' +
          '</div>' +
          '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
            '<defs><linearGradient id="gapFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3186FF" stop-opacity=".22"/><stop offset="100%" stop-color="#FC413D" stop-opacity=".14"/></linearGradient></defs>' +
            gridHtml + xLabels +
            '<polygon points="' + polyArea + '" fill="url(#gapFill)"/>' +
            '<polyline points="' + cpxPts + '" fill="none" stroke="#3186FF" stroke-width="3.5" stroke-linecap="round"/>' +
            '<polyline points="' + capPts + '" fill="none" stroke="#FC413D" stroke-width="3.5" stroke-dasharray="7 5" stroke-linecap="round"/>' +
            b3.complexity.map(function (v, i) { return '<circle cx="' + sx(i).toFixed(1) + '" cy="' + sy(v).toFixed(1) + '" r="4.5" fill="#3186FF"/>'; }).join('') +
            b3.capacity.map(function (v, i) { return '<circle cx="' + sx(i).toFixed(1) + '" cy="' + sy(v).toFixed(1) + '" r="4.5" fill="#FC413D"/>'; }).join('') +
          '</svg>' +
        '</section>' +
        '<section class="kpi-3">' +
          b3.kpis.map(function (k) {
            return '<div class="k-card"><div class="k-val">' + k.val + '</div><div class="k-lbl">' + k.lbl + '</div><div class="k-sub">' + k.sub + '</div></div>';
          }).join('') +
        '</section>';
      return;
    }

    var b4 = st.beat4;
    host.innerHTML =
      '<section class="story-card">' +
        '<div class="eyebrow">' + b4.eyebrow + '</div>' +
        '<h1 class="b-h1">' + b4.title + '</h1>' +
        '<p class="b-lead" style="margin-bottom:0">' + b4.lead + '</p>' +
      '</section>' +
      '<section class="crit-5">' +
        b4.criteria.map(function (c) {
          return '<div class="crit-card"><div class="crit-tag">' + c.tag + '</div><div class="crit-title">' + c.title + '</div><div class="crit-desc">' + c.desc + '</div></div>';
        }).join('') +
      '</section>' +
      '<section class="coex-banner">' +
        '<div class="coex-box-item">' + b4.coexLeft + '</div>' +
        '<div class="coex-op">+</div>' +
        '<div class="coex-box-item" style="border-color:rgba(49,134,255,.35);background:rgba(49,134,255,.08)">' + b4.coexRight + '</div>' +
        '<div class="coex-op">=</div>' +
        '<div class="coex-box-item" style="border-color:rgba(0,175,87,.35);background:rgba(0,175,87,.09);color:var(--green-ink)">' + b4.coexOutcome + '</div>' +
      '</section>';
  }

  btn.addEventListener('click', function () {
    var dark = document.documentElement.classList.toggle('theme-dark');
    document.documentElement.classList.toggle('theme-light', !dark);
    try { localStorage.setItem('deck-theme', dark ? 'dark' : 'light'); } catch (e) {}
    paintTheme();
  });

  renderBeat();
})();
</script>
</body>
</html>
