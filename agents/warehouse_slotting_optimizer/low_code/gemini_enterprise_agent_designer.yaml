# Gemini Enterprise Agent Designer (Low-Code / Declarative Specification)
apiVersion: gemini-enterprise.cloud.google.com/v1alpha
kind: DeclarativeAgent
metadata:
  agent_id: warehouse_slotting_optimizer
  display_name: "Warehouse Slotting Optimizer"
  build_tier: "High-Code"
  category: "Supply Chain Operations"
  primary_persona: "Supply Chain Lead"
spec:
  model_routing:
    default_model: gemini-3.1-pro-preview
    escalation_model: gemini-3.1-pro-preview
  a2ui_surfaces:
    inline_card: VegaChart (2-Panel Executive Comparison + Signed Variance Strip)
    side_panel_canvas: Looker Studio RichTable (spec={}) + MaterialExpansionPanels + Quick-Action Buttons
  bigquery_data_stores:
    - id: bq_supply_chain_twin_amr_picker_travel_telemetry
      uri: "bq://zuhaibp-ai.supply_chain_twin.amr_picker_travel_telemetry"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_slot_reassignment_recommendations
      uri: "bq://zuhaibp-ai.supply_chain_twin.slot_reassignment_recommendations"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_warehouse_slotting_velocity_tiers
      uri: "bq://zuhaibp-ai.supply_chain_twin.warehouse_slotting_velocity_tiers"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_wave_release_order_allocations
      uri: "bq://zuhaibp-ai.supply_chain_twin.wave_release_order_allocations"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
  data_source_tools:
    - inspect_bigquery_warehouse_slotting_optimizer_data_sources
    - query_sap_s4hana_master_data_backbone
    - query_bigquery_amr_picker_travel_telemetry
    - query_bigquery_slot_reassignment_recommendations
    - query_bigquery_warehouse_slotting_velocity_tiers
    - query_bigquery_wave_release_order_allocations
    - query_warehouse_slotting_velocity_tiers
    - query_amr_picker_travel_telemetry
    - query_wave_release_order_allocations
    - query_slot_reassignment_recommendations
    - run_warehouse_slotting_optimizer_constraint_and_variance_solver
    - render_warehouse_slotting_optimizer_a2ui_chart_and_canvas
    - draft_warehouse_slotting_optimizer_stakeholder_decision_memo
    - export_wave_release_order_allocations_csv_to_gcs
    - publish_warehouse_slotting_optimizer_interactive_cockpit_to_gcs
    - action_execute_slot_reassignment
    - action_balance_wave_release_profile
  governance_guardrails:
    - Never fabricate numbers, SKUs, POs, or invoice IDs; ground every metric in tool outputs.
    - Spell out all domain abbreviations on first use in plain business English.
    - Block any unverifiedoverride or safety bypass lacking pre-execution approval and idempotency_key.
