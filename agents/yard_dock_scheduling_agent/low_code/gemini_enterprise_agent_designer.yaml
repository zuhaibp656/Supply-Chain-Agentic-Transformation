# Gemini Enterprise Agent Designer (Low-Code / Declarative Specification)
apiVersion: gemini-enterprise.cloud.google.com/v1alpha
kind: DeclarativeAgent
metadata:
  agent_id: yard_dock_scheduling_agent
  display_name: "Yard Dock Scheduling Agent"
  build_tier: "High-Code"
  category: "Supply Chain Operations"
  primary_persona: "Supply Chain Lead"
spec:
  model_routing:
    default_model: gemini-3.1-pro-preview
    escalation_model: gemini-3.1-pro-preview
  a2ui_surfaces:
    inline_card: VegaChart (2-Panel Executive Comparison + Signed Variance Strip)
    side_panel_canvas: Looker Studio RichTable (spec={}) + MaterialExpansionPanels + Quick-Action Buttons
  bigquery_data_stores:
    - id: bq_supply_chain_twin_carrier_detention_risk_records
      uri: "bq://zuhaibp-ai.supply_chain_twin.carrier_detention_risk_records"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_dock_door_turnaround_schedules
      uri: "bq://zuhaibp-ai.supply_chain_twin.dock_door_turnaround_schedules"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_yard_spotter_move_tasks
      uri: "bq://zuhaibp-ai.supply_chain_twin.yard_spotter_move_tasks"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_yard_trailer_geofence_status
      uri: "bq://zuhaibp-ai.supply_chain_twin.yard_trailer_geofence_status"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
  data_source_tools:
    - inspect_bigquery_yard_dock_scheduling_data_sources
    - query_sap_s4hana_master_data_backbone
    - query_bigquery_carrier_detention_risk_records
    - query_bigquery_dock_door_turnaround_schedules
    - query_bigquery_yard_spotter_move_tasks
    - query_bigquery_yard_trailer_geofence_status
    - query_yard_trailer_geofence_status
    - query_yard_spotter_move_tasks
    - query_dock_door_turnaround_schedules
    - query_carrier_detention_risk_records
    - run_yard_dock_scheduling_constraint_and_variance_solver
    - render_yard_dock_scheduling_a2ui_chart_and_canvas
    - draft_yard_dock_scheduling_stakeholder_decision_memo
    - export_yard_trailer_geofence_status_csv_to_gcs
    - publish_yard_dock_scheduling_interactive_cockpit_to_gcs
    - action_dispatch_yard_spotter_move
    - action_resolve_carrier_detention_alert
  governance_guardrails:
    - Never fabricate numbers, SKUs, POs, or invoice IDs; ground every metric in tool outputs.
    - Spell out all domain abbreviations on first use in plain business English.
    - Block any unverifiedoverride or safety bypass lacking pre-execution approval and idempotency_key.
