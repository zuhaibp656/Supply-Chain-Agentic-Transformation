# Gemini Enterprise Agent Designer (Low-Code / Declarative Specification)
apiVersion: gemini-enterprise.cloud.google.com/v1alpha
kind: DeclarativeAgent
metadata:
  agent_id: planogram_merchandising_vision_auditor
  display_name: "Phantom Inventory Sensor"
  build_tier: "Hybrid"
  category: "04 \u00b7 Inventory & Warehousing \u2014 Omnichannel Visibility"
  primary_persona: "Store Operations / Omni Lead"
spec:
  model_routing:
    default_model: gemini-3.1-pro-preview
    escalation_model: gemini-3.1-pro-preview
  a2ui_surfaces:
    inline_card: VegaChart (2-Panel Executive Comparison + Signed Variance Strip)
    side_panel_canvas: Looker Studio RichTable (spec={}) + MaterialExpansionPanels + Quick-Action Buttons
  bigquery_data_stores:
    - id: bq_supply_chain_twin_contracted_planogram_templates
      uri: "bq://zuhaibp-ai.supply_chain_twin.contracted_planogram_templates"
      source_system: "Enterprise Category Management & Contracted Planogram Registry"
      protocol: "REST / BigQuery"
    - id: bq_supply_chain_twin_merchandising_corrective_tasks
      uri: "bq://zuhaibp-ai.supply_chain_twin.merchandising_corrective_tasks"
      source_system: "In-Store Mobile Merchandising Corrective Action Dispatcher"
      protocol: "Webhook / Push"
    - id: bq_supply_chain_twin_shelf_compliance_scoring_ledger
      uri: "bq://zuhaibp-ai.supply_chain_twin.shelf_compliance_scoring_ledger"
      source_system: "Share-of-Shelf (SOS) & Cooler Purity Compliance Scorer"
      protocol: "Python Analytics"
    - id: bq_supply_chain_twin_store_shelf_vision_audit_captures
      uri: "bq://zuhaibp-ai.supply_chain_twin.store_shelf_vision_audit_captures"
      source_system: "Vertex AI Gemini 3.8 Flash Dense Retail SKU & Facing Detector"
      protocol: "gRPC Multimodal API"
  data_source_tools:
    - inspect_gemini_38_planogram_merchandising_vision_auditor_data_sources
    - query_sap_s4hana_master_data_backbone
    - query_trade_planogram_contracted_planogram_templates
    - query_sfa_instore_merchandising_corrective_tasks
    - query_sos_compliance_shelf_compliance_scoring_ledger
    - query_gemini_38_store_shelf_vision_audit_captures
    - query_store_shelf_vision_audit_captures
    - query_contracted_planogram_templates
    - query_shelf_compliance_scoring_ledger
    - query_merchandising_corrective_tasks
    - run_planogram_merchandising_vision_auditor_constraint_and_variance_solver
    - render_planogram_merchandising_vision_auditor_a2ui_chart_and_canvas
    - draft_planogram_merchandising_vision_auditor_stakeholder_decision_memo
    - export_store_shelf_vision_audit_csv_to_gcs
    - publish_planogram_merchandising_vision_auditor_interactive_cockpit_to_gcs
    - action_dispatch_instore_restock_directive
    - action_certify_store_planogram_audit
  starter_prompts:
    - "Where does our store inventory system claim stock is on hand, yet zero units are scanning at checkout\u2014pointing to phantom inventory, misplaced backroom stock, or shrink?"
    - "Show me a chart comparing recorded on-hand store inventory against expected versus actual checkout scan velocity to spotlight phantom stock anomalies."
    - "Write a clear store operations alert note listing the top phantom-inventory stores and items so associates can audit shelves and trigger replenishment."
    - "Please trigger a targeted cycle-count audit and replenishment unlock for the store item showing the worst phantom inventory signal."
  governance_guardrails:
    - Never fabricate numbers, SKUs, POs, or invoice IDs; ground every metric in tool outputs.
    - Spell out all domain abbreviations on first use in plain business English.
    - Block any unverifiedoverride or safety bypass lacking pre-execution approval and idempotency_key.
