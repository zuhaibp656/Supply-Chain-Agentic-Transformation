[project]
name = "line_schedule_optimizer"
version = "0.1.0"
description = "FlowMaster — Finite Production Line Sequence & Job Shop Scheduler"
authors = [{ name = "Supply Chain Agentic Transformation Team" }]
requires-python = ">=3.10"
dependencies = [
    "google-cloud-aiplatform>=1.49.0",
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
    "ortools>=9.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
