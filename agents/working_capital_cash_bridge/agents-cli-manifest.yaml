description: "Bridges operational inventory levels to CFO cash flow (DIO, DPO, DSO), evaluating holding costs, standard cost variances, and AP discount optimization."
agent_class: "app.agent.WorkingCapitalCashBridgeAgent"
runtime:
  type: "adk"
  model: "gemini-3-pro-preview"
entrypoint: "app/agent.py"
tools:
  - "query_working_capital_metrics"
  - "query_inventory_valuation_ledger"
  - "query_trapped_cash_opportunities"
  - "query_ap_supplier_discount_invoices"
  - "action_rebalance_working_capital_buffer"
  - "action_trigger_dynamic_ap_discounting"
metadata:
  scor_category: "Cross-Persona Universal Core"
  tier_coverage: "Enterprise Treasury & Supply Chain Balance Sheet"
  roi_focus: "$85M working capital released, -14 days DSI/DIO, +1.4% operating margin"
