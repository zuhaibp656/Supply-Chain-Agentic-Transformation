[project]
name = "disruption-war-room-orchestrator"
version = "0.1.0"
description = "Autonomous multi-tier crisis war-room orchestration, supplier disaster mitigation, and cross-functional task coordination."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
adk = [
    "google-adk>=0.1.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]
