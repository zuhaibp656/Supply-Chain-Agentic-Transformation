# Gemini Enterprise Agent Designer (Low-Code / Declarative Specification)
apiVersion: gemini-enterprise.cloud.google.com/v1alpha
kind: DeclarativeAgent
metadata:
  agent_id: air_cargo_uld_optimizer
  display_name: "Air Cargo Uld Optimizer"
  build_tier: "High-Code"
  category: "Supply Chain Operations"
  primary_persona: "Supply Chain Lead"
spec:
  model_routing:
    default_model: gemini-3.1-pro-preview
    escalation_model: gemini-3.1-pro-preview
  a2ui_surfaces:
    inline_card: VegaChart (2-Panel Executive Comparison + Signed Variance Strip)
    side_panel_canvas: Looker Studio RichTable (spec={}) + MaterialExpansionPanels + Quick-Action Buttons
  bigquery_data_stores:
    - id: bq_supply_chain_twin_air_freight_priority_shipments
      uri: "bq://zuhaibp-ai.supply_chain_twin.air_freight_priority_shipments"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_flightaware_adsb_belly_capacity
      uri: "bq://zuhaibp-ai.supply_chain_twin.flightaware_adsb_belly_capacity"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_uld_3d_packing_manifests
      uri: "bq://zuhaibp-ai.supply_chain_twin.uld_3d_packing_manifests"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
    - id: bq_supply_chain_twin_uld_contour_geometry_specs
      uri: "bq://zuhaibp-ai.supply_chain_twin.uld_contour_geometry_specs"
      source_system: "BigQuery Supply Chain Twin"
      protocol: "BigQuery SQL"
  data_source_tools:
    - inspect_bigquery_air_cargo_uld_optimizer_data_sources
    - query_sap_s4hana_master_data_backbone
    - query_bigquery_air_freight_priority_shipments
    - query_bigquery_flightaware_adsb_belly_capacity
    - query_bigquery_uld_3d_packing_manifests
    - query_bigquery_uld_contour_geometry_specs
    - query_air_freight_priority_shipments
    - query_uld_contour_geometry_specs
    - query_uld_3d_packing_manifests
    - query_flightaware_adsb_belly_capacity
    - run_air_cargo_uld_optimizer_constraint_and_variance_solver
    - render_air_cargo_uld_optimizer_a2ui_chart_and_canvas
    - draft_air_cargo_uld_optimizer_stakeholder_decision_memo
    - export_uld_contour_geometry_specs_csv_to_gcs
    - publish_air_cargo_uld_optimizer_interactive_cockpit_to_gcs
    - action_release_3d_uld_buildup_manifest
    - action_book_air_charter_or_belly_allotment
  governance_guardrails:
    - Never fabricate numbers, SKUs, POs, or invoice IDs; ground every metric in tool outputs.
    - Spell out all domain abbreviations on first use in plain business English.
    - Block any unverifiedoverride or safety bypass lacking pre-execution approval and idempotency_key.
