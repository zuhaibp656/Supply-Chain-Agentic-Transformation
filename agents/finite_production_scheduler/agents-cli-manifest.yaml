name: finite_production_scheduler
display_name: "FlowMaster — Finite Production Line Sequence & Job Shop Scheduler"
version: 0.1.0
runtime: python310
entrypoint: app.agent:FiniteProductionSchedulerAgent
framework: google-adk
vertical: "03_make"
description: >
  FlowMaster solves finite capacity scheduling across packaging and filling production lines
  using Google OR-Tools CP-SAT constraint programming. It optimizes line changeover matrices,
  enforces allergen washouts (e.g. non-dairy before dairy), respects shift maintenance blocks,
  and dispatches sequenced production order blocks into SAP PP/DS.

parameters:
  model: "gemini-3-pro-preview"
  temperature: 0.1
  max_output_tokens: 4096

tools:
  - app.tools:list_systems
  - app.tools:query_production_orders_backlog
  - app.tools:query_changeover_matrix_rules
  - app.tools:query_plant_line_workcenters
  - app.tools:query_optimized_sequence_schedule
  - app.tools:action_solve_and_lock_finite_sequence
  - app.tools:action_dispatch_sap_ppds_sequence
  standards_compliance: "ASCM SCOR DS v14.0 Plan (P1-P5) · VICS CPFR Collaborative Planning Standard · A2UI v0.9"
  finops_tier: "gemini-3.8-flash (Context Cached -75%, 3-Yr FSP -20%, $3.13/1K calls, $200.85/mo enterprise, $1.04M/yr value, 432x ROI)"
  orchestrator_routing: "Agent Orchestrator dynamically routes between Gemini 3.8 Flash (gemini-3.8-flash) and Gemini 3.1 Pro / 4 Argon (gemini-3.1-pro / gemini-4-argon, subject to availability); evals run on Gemini 3.8 Flash & Gemini 4 Argon"
