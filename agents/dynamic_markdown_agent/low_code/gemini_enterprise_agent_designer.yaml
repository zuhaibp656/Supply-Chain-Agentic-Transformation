# Gemini Enterprise Agent Designer (Low-Code / Declarative Specification)
apiVersion: gemini-enterprise.cloud.google.com/v1alpha
kind: DeclarativeAgent
metadata:
  agent_id: dynamic_markdown_agent
  display_name: "Dynamic Markdown Agent"
  build_tier: "Hybrid"
  category: "06 \u00b7 Returns & Reverse Logistics \u2014 Expiry & Markdowns"
  primary_persona: "Merchandising / Store Ops Mgr"
spec:
  model_routing:
    default_model: gemini-3.1-pro-preview
    escalation_model: gemini-3.1-pro-preview
  a2ui_surfaces:
    inline_card: VegaChart (2-Panel Executive Comparison + Signed Variance Strip)
    side_panel_canvas: Looker Studio RichTable (spec={}) + MaterialExpansionPanels + Quick-Action Buttons
  bigquery_data_stores:
    - id: bq_supply_chain_twin_dte_price_elasticity_curves
      uri: "bq://zuhaibp-ai.supply_chain_twin.dte_price_elasticity_curves"
      source_system: "DTE Price Elasticity & Sell-Through Lift Engine"
      protocol: "Python / BigQuery ML"
    - id: bq_supply_chain_twin_esl_markdown_schedule_recommendations
      uri: "bq://zuhaibp-ai.supply_chain_twin.esl_markdown_schedule_recommendations"
      source_system: "Electronic Shelf Label (ESL) & App Markdown Controller"
      protocol: "REST / MQTT ESL"
    - id: bq_supply_chain_twin_markdown_margin_vs_shrink_ledger
      uri: "bq://zuhaibp-ai.supply_chain_twin.markdown_margin_vs_shrink_ledger"
      source_system: "Perishable Margin Recovery vs. Expiry Shrink Ledger"
      protocol: "SQL / Retail Finance"
    - id: bq_supply_chain_twin_perishable_store_lot_expiries
      uri: "bq://zuhaibp-ai.supply_chain_twin.perishable_store_lot_expiries"
      source_system: "GS1 DataBar Store Lot Expiry & On-Hand Engine"
      protocol: "REST / GS1-128 SQL"
  data_source_tools:
    - inspect_store_lot_dynamic_markdown_data_sources
    - query_sap_s4hana_master_data_backbone
    - query_vertex_price_dte_price_elasticity_curves
    - query_pricer_esl_esl_markdown_schedule_recommendations
    - query_perishable_store_lot_expiries
    - query_dte_price_elasticity_curves
    - query_esl_markdown_recommendations
    - query_markdown_margin_vs_shrink_ledger
    - query_sap_s4hana_short_dated_inventory_and_lot_batches
    - fetch_bigquery_price_elasticity_and_sell_through_velocity
    - query_food_bank_donation_and_tax_credit_rules
    - analyze_dte_elasticity_markdown_curve
    - run_optimal_markdown_depth_and_liquidation_timing_solver
    - render_dynamic_markdown_a2ui_chart_and_canvas
    - draft_store_esl_markdown_execution_sheet
    - export_markdown_schedule_csv_and_memo
    - publish_dynamic_markdown_interactive_cockpit_to_gcs
    - action_push_esl_markdown_price
    - action_flag_dte1_charity_pull_alert
    - commit_pos_promotional_markdown_to_sap_retail
  starter_prompts:
    - "Optimize price markdowns on short-dated perishable inventory across our retail distribution hubs in Mumbai and Bengaluru. Determine the optimal timing and discount depth to maximize revenue recovery before expiration, compare liquidation against charitable donation write-offs, and output an actionable markdown schedule."
    - "Plot an interactive dynamic markdown curve comparing projected unit sell-through velocity and net cash recovery across varying discount depths (10%, 25%, 40%, donation)."
    - "Draft a commercial markdown recommendation brief and interactive full-screen inventory salvage report for Merchandising and Retail Store Operations outlining pricing actions and waste reduction figures."
    - "Go ahead and push the recommended electronic shelf-label price markdown for our most urgent near-expiry store batch."
  governance_guardrails:
    - Never fabricate numbers, SKUs, POs, or invoice IDs; ground every metric in tool outputs.
    - Spell out all domain abbreviations on first use in plain business English.
    - Block any unverifiedoverride or safety bypass lacking pre-execution approval and idempotency_key.
